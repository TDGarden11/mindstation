<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心灵夜校 - 2025年5月活动日历</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #f8f9f6;
            color: #333;
            line-height: 1.6;
        }

        /* Banner 样式 */
        .banner {
            width: 100%;
            height: 40vh;
            min-height: 250px;
            background: linear-gradient(rgba(88, 129, 87, 0.7), rgba(88, 129, 87, 0.8)), url('https://picsum.photos/id/1059/1920/600');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 1rem;
        }

        .banner h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .banner p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        /* 容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 0.6rem 1.5rem;
            border: 2px solid #588157;
            background: white;
            color: #588157;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #588157;
            color: white;
        }

        /* 日历区域 */
        .calendar-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        .calendar-title {
            text-align: center;
            font-size: 1.5rem;
            color: #588157;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .calendar-weekday {
            text-align: center;
            font-weight: 600;
            color: #666;
            padding: 0.5rem;
            font-size: 0.9rem;
        }

        .calendar-day {
            aspect-ratio: 1;
            min-height: 60px;
            padding: 0.5rem;
            border-radius: 10px;
            background: #f8f9f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .calendar-day:hover {
            background: #e9f1e9;
        }

        .calendar-day.today {
            background: #588157;
            color: white;
        }

        .calendar-day.empty {
            background: transparent;
            cursor: default;
        }

        .calendar-day .date-num {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .calendar-day .event-dots {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .event-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .dot-live { background: #457b9d; }
        .dot-workshop { background: #588157; }
        .dot-cocreate { background: #9c6644; }
        .dot-salon { background: #e9c46a; }
        .dot-study { background: #d88373; }

        /* 活动列表 */
        .events-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .events-title {
            text-align: center;
            font-size: 1.5rem;
            color: #588157;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .event-card {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
            border-radius: 12px;
            background: #f8f9f6;
            transition: all 0.3s ease;
            border-left: 4px solid #588157;
        }

        .event-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .event-date {
            min-width: 70px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .event-date .day {
            font-size: 2rem;
            font-weight: 700;
            color: #588157;
            line-height: 1;
        }

        .event-date .month {
            font-size: 0.9rem;
            color: #888;
        }

        .event-content {
            flex: 1;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .event-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3436;
        }

        .event-type {
            padding: 0.25rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            color: white;
            font-weight: 500;
        }

        .type-live { background: #457b9d; }
        .type-workshop { background: #588157; }
        .type-cocreate { background: #9c6644; }
        .type-salon { background: #e9c46a; color: #333; }
        .type-study { background: #d88373; }

        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .event-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .event-note {
            font-size: 0.85rem;
            color: #888;
            font-style: italic;
        }

        .event-action {
            display: flex;
            align-items: center;
        }

        .btn-signup {
            padding: 0.6rem 1.5rem;
            background: #588157;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-signup:hover {
            background: #476b47;
        }

        /* 早鸟提示 */
        .early-bird-alert {
            background: linear-gradient(135deg, #d8837320, #d8837310);
            border: 1px dashed #d88373;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #9c5548;
        }

        .early-bird-alert strong {
            font-size: 1.1rem;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 2rem;
            color: #888;
            font-size: 0.9rem;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .banner h1 {
                font-size: 1.8rem;
            }

            .calendar-day {
                min-height: 50px;
                padding: 0.3rem;
            }

            .calendar-day .date-num {
                font-size: 0.9rem;
            }

            .event-dot {
                width: 4px;
                height: 4px;
            }

            .event-card {
                flex-direction: column;
                gap: 1rem;
            }

            .event-date {
                flex-direction: row;
                gap: 0.5rem;
                align-items: center;
                justify-content: flex-start;
            }

            .event-header {
                flex-direction: column;
            }

            .event-action {
                margin-top: 1rem;
                justify-content: flex-end;
            }
            .banner p {
                font-size: 1rem;
            }
            .container {
                padding: 1.5rem 0.8rem;
            }
            .calendar-section, .events-section {
                padding: 1.2rem;
            }
            .filter-btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.9rem;
            }
            .calendar-grid {
                gap: 0.3rem;
            }
            .calendar-weekday {
                font-size: 0.8rem;
            }
            .calendar-day {
                min-height: 45px;
                padding: 0.25rem;
            }
            .calendar-day .date-num {
                font-size: 0.85rem;
            }
            .event-date .day {
                font-size: 1.6rem;
            }
            .event-title {
                font-size: 1.1rem;
            }
            .event-meta {
                font-size: 0.85rem;
            }
            .btn-signup {
                font-size: 0.85rem;
                padding: 0.5rem 1.2rem;
            }
        }
        @media (max-width: 480px) {
            .banner h1 {
                font-size: 1.5rem;
            }
            .banner p {
                font-size: 0.9rem;
            }
            .container {
                padding: 1rem 0.5rem;
            }
            .calendar-section, .events-section {
                padding: 1rem;
            }
            .filter-bar {
                gap: 0.6rem;
            }
            .filter-btn {
                padding: 0.4rem 1rem;
                font-size: 0.85rem;
            }
            .calendar-grid {
                gap: 0.2rem;
            }
            .calendar-weekday {
                font-size: 0.75rem;
            }
            .calendar-day {
                min-height: 38px;
                padding: 0.2rem;
            }
            .calendar-day .date-num {
                font-size: 0.8rem;
            }
            .event-card {
                padding: 1rem;
            }
            .event-title {
                font-size: 1rem;
            }
            .event-meta {
                font-size: 0.8rem;
                gap: 0.6rem;
            }
            .event-note {
                font-size: 0.8rem;
            }
            .btn-signup {
                font-size: 0.8rem;
                padding: 0.45rem 1rem;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Banner 区域 -->
    <div class="banner">
        <h1>心灵夜校 · 5月活动日历</h1>
        <p>探索心灵成长，遇见更好的自己</p>
    </div>

    <div class="container">
        <!-- 筛选栏 -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">全部活动</button>
            <button class="filter-btn" data-filter="北京">北京活动</button>
            <button class="filter-btn" data-filter="上海">上海活动</button>
            <button class="filter-btn" data-filter="线上">线上活动</button>
        </div>

        <!-- 早鸟提示 -->
        <div class="early-bird-alert">
            <strong>🌟 早鸟优惠提醒</strong>：5月31日前报名「贵州原生态社区深度营」，可享专属早鸟价！
        </div>

        <!-- 日历区域 -->
        <div class="calendar-section">
            <div class="calendar-title">2025年5月 · 月历视图</div>
            <div class="calendar-grid">
                <!-- 星期表头 -->
                <div class="calendar-weekday">周一</div>
                <div class="calendar-weekday">周二</div>
                <div class="calendar-weekday">周三</div>
                <div class="calendar-weekday">周四</div>
                <div class="calendar-weekday">周五</div>
                <div class="calendar-weekday">周六</div>
                <div class="calendar-weekday">周日</div>
            </div>
        </div>

        <!-- 活动列表 -->
        <div class="events-section">
            <div class="events-title">活动详情列表</div>
            <div class="events-list" id="eventsList">
                <!-- 活动卡片将通过JS动态生成 -->
            </div>
        </div>
    </div>

    <footer>
        <p>心灵夜校 · 心舟共暖夜归人</p>
    </footer>

    <script>
        // 活动数据
        const events = [
            {
                date: 7,
                time: "晚八点",
                title: "「心可能」贵州原生态社区深度营推荐第一场",
                type: "线上直播",
                location: "心可能直播间",
                leader: "李剑雄 对话 贵阳主理人河伯、美德侗寨主理人张传辉",
                note: "",
                city: "线上",
                link: "https://mp.weixin.qq.com/s/waEvCZ9CgYzOR0BivlRvuQ"
            },
            {
                date: 10,
                time: "上午10点",
                title: "「心灵夜校」释梦剧场体验坊",
                type: "工作坊",
                location: "北京东城党群服务中心",
                leader: "徐凤兰",
                note: "优先面向心灵夜校共创者，免费",
                city: "北京"
            },
            {
                date: 10,
                time: "下午2点",
                title: "「心可能」共创会议",
                type: "共创会议",
                location: "北京奥森",
                leader: "",
                note: "可能会创始会员专属",
                city: "北京"
            },
            {
                date: 13,
                time: "晚八点",
                title: "「心可能」贵州原生态社区深度营推荐第二场",
                type: "线上直播",
                location: "心可能直播间",
                leader: "2025贵州营往期参与伙伴真实体验分享",
                note: "",
                city: "线上",
                link: "https://mp.weixin.qq.com/s/waEvCZ9CgYzOR0BivlRvuQ"
            },
            {
                date: 17,
                time: "上午10点",
                title: "「心可能」沙龙503期：正念.情绪和解",
                type: "沙龙",
                location: "北京东城区党群服务中心",
                leader: "李瑞鹏",
                note: "",
                city: "北京",
                link: "https://appdfdmuzr54671.h5.xiaoeknow.com/v1/goods/goods_detail/course_3DNxKNqquTEZLkBeguDAkc5kZhJ"
            },
            {
                date: 17,
                time: "10:30-12:00",
                title: "「心灵夜校」公开沙龙：平和瑜伽 Nadi Shuddhi",
                type: "沙龙",
                location: "上海牧云记书店",
                leader: "Ida",
                note: "主理人jessica",
                city: "上海",
                link: "https://appdfdmuzr54671.h5.xiaoeknow.com/v1/goods/goods_detail/course_3AOIL5ykjO9LHBejY4J8Ce06l02"
            },
            {
                date: 22,
                time: "晚7-9点",
                title: "「心灵夜校」故事圆圈-转变叙事之夜",
                type: "工作坊",
                location: "北京东城区巴巴新生活四合院",
                leader: "何佳",
                note: "主理人剑雄",
                city: "北京"
            },
            {
                date: 24,
                time: "10:30-12:00",
                title: "「心灵夜校」公开沙龙：空间的净化与取舍",
                type: "沙龙",
                location: "上海牧云记书店",
                leader: "Ida",
                note: "主理人jessica",
                city: "上海",
                link: "https://appdfdmuzr54671.h5.xiaoeknow.com/v1/goods/goods_detail/course_3AOH9r60rIsZWgzu8FhEdy9X0t5"
            },
            {
                date: 31,
                time: "全天",
                title: "「心可能」贵州原生态社区深度营 早鸟价报名截止",
                type: "研学营",
                location: "",
                leader: "",
                note: "5月31日前报名享早鸟优惠",
                city: "线上",
                link: "https://mp.weixin.qq.com/s/waEvCZ9CgYzOR0BivlRvuQ"
            }
        ];

        // 类型映射
        const typeMap = {
            "线上直播": { class: "live", dotClass: "dot-live", typeClass: "type-live" },
            "工作坊": { class: "workshop", dotClass: "dot-workshop", typeClass: "type-workshop" },
            "共创会议": { class: "cocreate", dotClass: "dot-cocreate", typeClass: "type-cocreate" },
            "沙龙": { class: "salon", dotClass: "dot-salon", typeClass: "type-salon" },
            "研学营": { class: "study", dotClass: "dot-study", typeClass: "type-study" }
        };

        // 初始化日历
        function initCalendar() {
            const calendarGrid = document.querySelector('.calendar-grid');
            const today = 8; // 当前日期，可根据实际调整

            // 5月1日是周四，所以前面空3个位置（周一、周二、周三）
            for (let i = 0; i < 3; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                calendarGrid.appendChild(emptyDay);
            }

            // 生成1-31号
            for (let day = 1; day <= 31; day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';
                dayEl.dataset.date = day;

                // 今天高亮
                if (day === today) {
                    dayEl.classList.add('today');
                }

                // 日期数字
                const dateNum = document.createElement('div');
                dateNum.className = 'date-num';
                dateNum.textContent = day;
                dayEl.appendChild(dateNum);

                // 活动点
                const dayEvents = events.filter(e => e.date === day);
                if (dayEvents.length > 0) {
                    const dots = document.createElement('div');
                    dots.className = 'event-dots';
                    dayEvents.forEach(event => {
                        const dot = document.createElement('div');
                        dot.className = `event-dot ${typeMap[event.type].dotClass}`;
                        dots.appendChild(dot);
                    });
                    dayEl.appendChild(dots);

                    // 点击日期筛选
                    dayEl.addEventListener('click', () => filterByDate(day));
                }

                calendarGrid.appendChild(dayEl);
            }
        }

        // 渲染活动列表
        function renderEvents(filter = 'all') {
            const eventsList = document.getElementById('eventsList');
            eventsList.innerHTML = '';

            // 过滤活动
            let filteredEvents = events;
            if (filter !== 'all' && typeof filter === 'string') {
                filteredEvents = events.filter(e => e.city === filter);
            } else if (typeof filter === 'number') {
                filteredEvents = events.filter(e => e.date === filter);
            }

            // 按日期排序
            filteredEvents.sort((a, b) => a.date - b.date);

            if (filteredEvents.length === 0) {
                eventsList.innerHTML = '<p style="text-align: center; color: #888;">该分类下暂无活动</p>';
                return;
            }

            filteredEvents.forEach(event => {
                const typeInfo = typeMap[event.type];
                const card = document.createElement('div');
                card.className = 'event-card';
                card.dataset.city = event.city;
                card.dataset.date = event.date;

                card.innerHTML = `
                    <div class="event-date">
                        <div class="day">${event.date}</div>
                        <div class="month">5月</div>
                    </div>
                    <div class="event-content">
                        <div class="event-header">
                            <h3 class="event-title">${event.title}</h3>
                            <span class="event-type ${typeInfo.typeClass}">${event.type}</span>
                        </div>
                        <div class="event-meta">
                            <span>🕐 ${event.time}</span>
                            ${event.location ? `<span>📍 ${event.location}</span>` : ''}
                            ${event.leader ? `<span>👤 带领人：${event.leader}</span>` : ''}
                        </div>
                        ${event.note ? `<div class="event-note">${event.note}</div>` : ''}
                    </div>
                    <div class="event-action">
                        ${event.link ? `<a href="${event.link}" target="_blank" class="btn-signup">立即报名</a>` : `<button class="btn-signup">立即报名</button>`}
                    </div>
                `;

                eventsList.appendChild(card);
            });
        }

        // 筛选功能
        function filterByCity(city) {
            // 更新按钮状态
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === city) {
                    btn.classList.add('active');
                }
            });
            renderEvents(city);
        }

        function filterByDate(date) {
            // 重置按钮状态
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            renderEvents(date);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initCalendar();
            renderEvents();

            // 绑定筛选按钮事件
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterByCity(btn.dataset.filter);
                });
            });
        });
    </script>


</body></html>
